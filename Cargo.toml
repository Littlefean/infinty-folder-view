[package]
name = "infinity-markdown-skia"
version = "0.1.0"
edition = "2024"
description = "A native Metal + Skia infinite canvas for reading Markdown"
license = "MIT"

[dependencies]
skia-safe = { version = "=0.157.0", features = ["metal", "ganesh", "textlayout"] }
winit = "0.30"
raw-window-handle = "0.6"
pulldown-cmark = "0.13"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1.12"
ignore = "0.4.33"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-metal = { version = "0.3", default-features = false, features = ["MTLDevice", "MTLCommandBuffer", "MTLCommandQueue", "MTLDrawable", "MTLPixelFormat", "MTLAllocation", "MTLResource", "MTLTexture"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["objc2-core-foundation", "objc2-metal", "CAMetalLayer"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["objc2-quartz-core", "NSView", "NSResponder", "NSPasteboard", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSApplication"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
